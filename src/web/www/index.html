<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MS-0515</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: .5em; align-items: center; padding: .5em .75em; background: #1b1b1b; }
  header h1 { font-size: 1em; margin: 0 .5em 0 0; color: #fff; }
  select, button, label { font: inherit; }
  button { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 4px; padding: .25em .6em; cursor: pointer; }
  button:hover { background: #383838; }
  main { display: flex; justify-content: center; padding: .75em; }
  #screen { width: min(100vw - 1.5em, calc((100vh - 7em) * 1.6)); aspect-ratio: 8 / 5; background: #000;
            image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
  #screen:focus { box-shadow: 0 0 0 2px #5a8; }
  footer { padding: 0 .75em .75em; color: #999; }
  #status { color: #bbb; }
  label.file { display: inline-block; }
  label.file input { display: none; }
</style>
</head>
<body>
<header>
  <h1>MS-0515</h1>
  <label>ROM <select id="rom"><option value="a">A</option><option value="b">B</option></select></label>
  <label>disk <select id="disk"></select></label>
  <button id="boot">Boot</button>
  <button id="sound">Sound: off</button>
  <button id="save">Save state</button>
  <button id="restore">Restore</button>
  <button id="download">Download disk</button>
  <button id="original">Forget my copy</button>
  <label class="file"><button type="button" onclick="this.parentNode.querySelector('input').click()">Open image…</button><input id="file" type="file" accept=".dsk"></label>
</header>
<main>
  <canvas id="screen" width="640" height="400" tabindex="0"></canvas>
</main>
<footer>
  <div id="status">loading…</div>
  <div>Click the screen to type. Disks you write to stay in this browser (IndexedDB); "Download disk" saves a copy, "Forget my copy" returns to the original. Keys: the host letters and digits are the MS7004's, arrows, the numeric keypad, F1–F12; Left Alt = Compose, Right Alt = РУС/ЛАТ.</div>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
