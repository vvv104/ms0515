[project]
name      = "MANICM"
language  = "macro11"
pre_build = "source/gen_data.py"        # MANICM.DAT from the original's snapshot
sources   = ["MANICM.MAC", "MS0515.MAC"]
outputs   = ["MANICM.SAV", "MANICM.MAP"]   # the map names the state for the tests

[build]
# LINK's line is image,map=objects.
commands  = ["MACRO MANICM=MANICM", "MACRO MS0515=MS0515",
             "LINK MANICM,MANICM=MANICM,MS0515"]
