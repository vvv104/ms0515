# Saboteur II at its loading screen: the OSA system with the game alone on
# the diskette, R SABOT2 typed, the loader through - tools/make_start.py
# turns this into sabot2.zip beside it (see ../README.md, "Start files").
title = "Saboteur II"
rom   = "a"
joystick = true         # J in the game's menu takes the Kempston port

[disk]
system = "osa"
media  = "ss"
add    = ["sabot2-osa"]
name   = "sabot2.dsk"

[run]
script = ["R SABOT2"]
settle = 2.0
wait   = 4.0            # the loading screen: it gives way to the menu at about 8.5 s

[sound]
speaker = true
drive   = false
kbd     = false
speed   = 100
