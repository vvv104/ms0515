# Saboteur II at its menu, its loading screen for the picture: the OSA
# system with the game alone on the diskette, R SABOT2 typed - tools/make_start.py
# turns this into sabot2.zip beside it (see ../README.md, "Start files").
title = "Saboteur II"
rom   = "a"
joystick = true         # J in the game's menu takes the Kempston port

[disk]
system = "osa"
media  = "ss"
add    = ["sabot2-osa"]
name   = "sabot2.dsk"

[run]
script = ["R SABOT2"]
settle = 2.0
wait   = 12.0           # the start: the menu (K/P/J/R/M/S), up from about 8.5 s of machine time
screen = 4.0            # the picture: the loading screen, 1.5 s to 8.5 s

[sound]
speaker = true
drive   = false
kbd     = false
speed   = 100
