name: Pages

# The browser build as a GitHub Pages site: published on every release tag
# (so the site matches the release) and on demand.  The repository's Pages
# source must be "GitHub Actions" (Settings -> Pages), and the github-pages
# environment's deployment-branch policy must allow the tags (a "v*" tag
# rule next to the default "main"; without it the deploy job is refused).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Conan
        run: pip install "conan>=2.0" ninja

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2
          key: conan-web-${{ hashFiles('src/conanfile.py', 'src/profiles/emscripten') }}
          restore-keys: |
            conan-web-

      - name: Configure Conan build profile
        run: conan profile detect --force

      - name: Build (Emscripten)
        working-directory: src
        run: |
          export EM_NODE_JS="$(which node)"
          conan build . -pr:h profiles/emscripten -pr:b default --build=missing

      - name: Smoke test (Node)
        run: node src/web/smoke.mjs src/build/emscripten-release/web/dist

      - uses: actions/upload-pages-artifact@v4
        with:
          path: src/build/emscripten-release/web/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
