name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            archive_ext: tar.gz
          - os: windows-latest
            platform: windows-x64
            archive_ext: zip

    steps:
      - uses: actions/checkout@v6

      # The software collection: ms0515-run carries the dec system inside,
      # and its build step composes and boots that system's diskette from
      # the collection's kit (src/tools/run).
      - uses: actions/checkout@v6
        with:
          repository: vvv104/ms0515-software
          path: ms0515-software

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install "conan>=2.0" ninja

      - name: Install GCC 13 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc-13 g++-13

      - name: Configure Conan profile
        shell: bash
        run: |
          conan profile detect --force
          PROFILE=~/.conan2/profiles/default
          sed -i.bak -e 's/^compiler.cppstd=.*/compiler.cppstd=20/' "$PROFILE"

          if [ "${{ runner.os }}" = "Linux" ]; then
            sed -i -e 's/^compiler=.*/compiler=gcc/' "$PROFILE"
            sed -i -e 's/^compiler\.version=.*/compiler.version=13/' "$PROFILE"
          fi

          # Windows: static MSVC runtime → self-contained binary, no
          # VCRedist needed on user machines.  +300 KB to the exe.
          if [ "${{ runner.os }}" = "Windows" ]; then
            sed -i -e 's/^compiler\.runtime=.*/compiler.runtime=static/' "$PROFILE"
          fi

          {
            echo ""
            echo "[conf]"
            if [ "${{ runner.os }}" = "Windows" ]; then
              echo "tools.cmake.cmaketoolchain:generator=Ninja"
            fi
            if [ "${{ runner.os }}" = "Linux" ]; then
              echo "tools.system.package_manager:mode=install"
              echo "tools.system.package_manager:sudo=True"
            fi
          } >> "$PROFILE"

      - name: Build
        shell: bash
        working-directory: src
        env:
          CC: ${{ runner.os == 'Linux' && 'gcc-13' || '' }}
          CXX: ${{ runner.os == 'Linux' && 'g++-13' || '' }}
          MS0515_SOFTWARE_DIR: ${{ github.workspace }}/ms0515-software
        run: conan build . --build=missing

      - name: Pack artifact
        shell: bash
        run: |
          NAME=ms0515-${{ github.ref_name }}-${{ matrix.platform }}

          # Strip runtime-generated files that shouldn't ship, and any disk
          # a local build left: the disks come from the software collection.
          rm -f package/ms0515.yaml
          rm -rf package/assets/disks

          # ms0515-run is left out of a build that has no software
          # collection, without an error: a release must not go out so.
          EXE=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXE=".exe"; fi
          for binary in ms0515 ms0515-cli ms0515-disk ms0515-run; do
            test -f "package/${binary}${EXE}" || { echo "missing: ${binary}${EXE}"; exit 1; }
          done

          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd package && 7z a -tzip "../${NAME}.zip" .)
          else
            tar -C package -czf "${NAME}.tar.gz" .
          fi

          ls -la "${NAME}".*

      - uses: softprops/action-gh-release@v2
        with:
          files: ms0515-${{ github.ref_name }}-${{ matrix.platform }}.${{ matrix.archive_ext }}
          draft: true
          # No auto-generated "What's Changed" / "New Contributors" — those
          # got confused when a previous tag was left as an unpublished
          # draft.  Notes are written by hand on the draft after upload.
